<!-- Favicon do ENEM Estudos. Não é a redução da assinatura: é um desenho
     próprio para 16px. A placa ocupa a arte inteira (margem some nesse
     tamanho), os traços são mais grossos e o braço do meio, a marcação
     amarela, é o que mantém o símbolo reconhecível quando tudo encolhe. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="3" fill="#071d41"/>
  <rect x="7" y="6" width="4.5" height="20" fill="#ffffff"/>
  <rect x="7" y="6" width="18" height="4.5" fill="#ffffff"/>
  <rect x="7" y="21.5" width="18" height="4.5" fill="#ffffff"/>
  <rect x="7" y="13.75" width="12" height="4.5" fill="#ffcd07"/>
</svg>
